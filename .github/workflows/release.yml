name: Release Catime

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (for example v2026.09.28)'
        required: true
        type: string

# Add permissions configuration
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_version: ${{ steps.get_version.outputs.tag_version }}
      release_tag: ${{ steps.get_version.outputs.release_tag }}
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      
    - name: Set up China timezone
      run: |
        sudo timedatectl set-timezone Asia/Shanghai
        echo "Current timezone: $(date +%Z)"
        echo "Current time: $(date)"
        
    - name: Install MinGW compiler and CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake
        cmake --version
        
    - name: Extract version number
      id: get_version
      env:
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          RELEASE_TAG="$INPUT_RELEASE_TAG"
        else
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
        fi

        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Expected a stable tag like v2026.09.28, got '$RELEASE_TAG'."
          exit 1
        fi

        VERSION=$(grep -oP '#define CATIME_VERSION "\K[^"]+' resource/resource.h)
        TAG_VERSION="${RELEASE_TAG#v}"
        if [ "$VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag version '$TAG_VERSION' does not match CATIME_VERSION '$VERSION'."
          exit 1
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
        echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
      
    - name: Build application
      run: |
        # Make build script executable
        chmod +x build.sh
        
        # Build using the same script as local development
        ./build.sh Release
        
        # Copy and rename the executable from build directory
        mkdir -p output
        cp build/catime.exe ./output/catime_${{ env.TAG_VERSION }}.exe
        echo "Build completed using build.sh script"
        
    - name: Upload unsigned release artifact
      id: upload-unsigned
      uses: actions/upload-artifact@v7
      with:
        name: catime-release-${{ env.TAG_VERSION }}
        path: output/catime_${{ env.TAG_VERSION }}.exe
        retention-days: 1

  # Code signing job
  sign:
    needs: build
    uses: ./.github/workflows/signpath-sign.yml
    with:
      artifact-name: catime-release-${{ needs.build.outputs.tag_version }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      version: ${{ needs.build.outputs.tag_version }}
      is-release: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  # Release job
  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download signed artifact
      uses: actions/download-artifact@v8
      with:
        name: catime-release-${{ needs.build.outputs.tag_version }}
        path: ./signed-release
        
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: ./signed-release/catime_${{ needs.build.outputs.tag_version }}.exe
        name: ${{ needs.build.outputs.release_tag }}
        tag_name: ${{ needs.build.outputs.release_tag }}
        body: |
          ## Changes

          - Fixed alarm scheduling and persistence so alarms keep their times and repeat settings after edits and restarts.
          - Preserved saved alarm details when Catime rebuilds the configuration file during an upgrade.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update Winget Package
      uses: vedantmgoyal2009/winget-releaser@v2
      with:
        identifier: VladElaina.Catime
        version: ${{ needs.build.outputs.tag_version }}
        installers-regex: '\.exe$'
        token: ${{ secrets.WINGET_TOKEN }}

  # Clean up temporary artifacts
  cleanup:
    needs: [sign, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Delete temporary signing package
      uses: geekyeggo/delete-artifact@v6
      with:
        name: catime-signing-package
        failOnError: false
